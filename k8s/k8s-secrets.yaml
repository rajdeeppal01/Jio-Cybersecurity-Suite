apiVersion: v1
kind: Secret
metadata:
  name: jcs-secrets
  namespace: jcs
type: Opaque
stringData:
  # PostgreSQL credentials
  DATABASE_URL: "postgresql://jcs_user:jcs_password@postgres:5432/jcs_db"
  # Redis connection
  REDIS_URL: "redis://redis:6379/0"
  # JWT signing secret - CHANGE THIS in production to a 32+ char random value
  JWT_SECRET_KEY: "jcs-super-secret-key-change-in-prod-32chars"
  # Admin dashboard credentials
  ADMIN_USERNAME: "admin"
  # bcrypt hash of "jcs2026" - regenerate with: python -c "from passlib.context import CryptContext; print(CryptContext(schemes=['bcrypt']).hash('your_password'))"
  ADMIN_PASSWORD_HASH: "$2b$12$M4MxgXHfSvzXM7MzaoOuguQMXfXaZg729ihJfrzdm3dl1lxlqV8Zu"
  # Gemini API Key - set your real key here
  GEMINI_API_KEY: ""
