---
# Allow Gateway to reach PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-postgres
  namespace: jcs
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: worker-t1
        - podSelector:
            matchLabels:
              app: worker-t2
      ports:
        - protocol: TCP
          port: 5432
  policyTypes:
    - Ingress

---
# Allow Gateway and Workers to reach Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-redis
  namespace: jcs
spec:
  podSelector:
    matchLabels:
      app: redis
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: worker-t1
        - podSelector:
            matchLabels:
              app: worker-t2
      ports:
        - protocol: TCP
          port: 6379
  policyTypes:
    - Ingress

---
# Allow only external traffic to reach the Gateway on port 8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-gateway
  namespace: jcs
spec:
  podSelector:
    matchLabels:
      app: gateway
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  policyTypes:
    - Ingress

---
# Default deny all other ingress within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: jcs
spec:
  podSelector: {}
  policyTypes:
    - Ingress
