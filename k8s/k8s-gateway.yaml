apiVersion: apps/v1
kind: Deployment
metadata:
  name: jcs-gateway
  namespace: jcs
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Run as non-root user (UID 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: docker.io/library/jcs-gateway:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Security Context: lock down container filesystem
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # FastAPI needs to write temp files
            capabilities:
              drop:
                - ALL
          # Resource limits: prevent resource exhaustion attacks
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Load all sensitive credentials from Kubernetes Secret
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jcs-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: jcs-secrets
                  key: REDIS_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jcs-secrets
                  key: GEMINI_API_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jcs-secrets
                  key: JWT_SECRET_KEY
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jcs-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: jcs-secrets
                  key: ADMIN_PASSWORD_HASH
          # Readiness probe: only send traffic when gateway is ready
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: jcs
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jcs-ingress
  namespace: jcs
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
